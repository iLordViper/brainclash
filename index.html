<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brainclash">
<meta name="description" content="Brainclash – Quiz-Duelle mit Freunden">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Brainclash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one-screen phone app — logo bar, scrolling stage, fixed tab bar; quiz screens take the whole stage. Look: late-night TV game show (stage lights, marquee bulbs, chunky arcade buttons). */
:root{
  color-scheme:dark;
  --bg:#0E1A2B; --bg2:#0B1524; --surface:#172B45; --surface-2:#203A5E; --line:#2D4A73;
  --ink:#F5F0E6; --muted:#9FB3CC;
  --gold:#FFC53D; --gold-deep:#A86A00; --coral:#FF6B57; --coral-deep:#B43A28;
  --mint:#3DDC97; --mint-deep:#178A5A; --red:#FF4D6D; --red-deep:#A51E3A; --sky:#5BC0FF;
  --shadow:#08111F;
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--font-body);font-size:16px;font-weight:700;overflow:hidden;
  background:radial-gradient(120% 55% at 50% -10%,#24467A 0%,rgba(36,70,122,0) 62%),radial-gradient(80% 40% at 100% 100%,rgba(255,107,87,.12),rgba(255,107,87,0) 70%),var(--bg);
  background-color:var(--bg);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--font-display);font-size:23px;letter-spacing:.5px;color:var(--gold);text-shadow:0 3px 0 #6E4600;white-space:nowrap}
.logo span{color:var(--ink);text-shadow:0 3px 0 var(--shadow)}
.top-r{display:flex;gap:6px;align-items:center;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.gold{background:var(--gold);color:#2A1700;border-color:var(--gold)}
.live{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(61,220,151,.7);animation:livep 1.8s infinite}
@keyframes livep{70%{box-shadow:0 0 0 7px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(100px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
body.game .top,body.game .tabbar{display:none}
body.game #view{padding-block:calc(10px) calc(24px + env(safe-area-inset-bottom,0px))}
body.chatv #view{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,21,36,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:528px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:11.5px;font-weight:900;color:var(--muted);position:relative}
.tab .ic{font-size:22px;line-height:1;transition:transform .25s cubic-bezier(.2,1.6,.4,1);filter:grayscale(.6)}
.tab.on{color:var(--gold)}.tab.on .ic{transform:translateY(-3px) scale(1.15);filter:none}
.badge{position:absolute;top:3px;left:calc(50% + 8px);background:var(--coral);color:#fff;font-size:10.5px;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg2)}

h2.sec{font-family:var(--font-display);font-weight:400;font-size:22px;margin:22px 0 10px;letter-spacing:.3px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2.sec small{font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:800}
.muted{color:var(--muted)}
.center{text-align:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-size:19px;letter-spacing:.4px;background:var(--gold);color:#2A1700;border-radius:16px;padding:13px 20px;box-shadow:0 5px 0 var(--gold-deep);transition:transform .08s,box-shadow .08s;min-height:52px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--gold-deep)}
.btn.block{width:100%}
.btn.big{width:100%;font-size:22px;min-height:60px;margin-top:18px}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coral-deep)}
.btn.mint{background:var(--mint);color:#06281A;box-shadow:0 5px 0 var(--mint-deep)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:0 5px 0 var(--shadow)}
.btn.small{font-size:15px;min-height:40px;padding:8px 14px;border-radius:12px}
.btn:disabled{opacity:.6}
.linkbtn{color:var(--muted);font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* banner */
.banner{position:relative;border-radius:24px;padding:16px 16px 22px;display:flex;gap:14px;align-items:center;overflow:hidden;box-shadow:0 8px 0 var(--shadow);color:#fff;isolation:isolate}
.banner::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 15% 20%,rgba(255,255,255,.25),rgba(255,255,255,0) 60%);z-index:-1}
.banner .av{flex:none;width:86px;height:86px;border-radius:50%;border:4px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.25);overflow:hidden}
.av svg{display:block;width:100%;height:100%}
.who{min-width:0;flex:1}
.bname{font-family:var(--font-display);font-size:27px;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:46px}
.btitle{font-weight:900;font-size:13px;opacity:.95;text-shadow:0 1px 0 rgba(0,0,0,.3);margin-top:2px}
.bstats{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:900;margin-top:6px;text-shadow:0 1px 0 rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
.xp{height:10px;border-radius:6px;background:rgba(0,0,0,.28);overflow:hidden;margin-top:8px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#fff,#FFE48A);border-radius:6px;transition:width .9s cubic-bezier(.2,.9,.3,1)}
.xpl{font-size:11px;font-weight:800;opacity:.9;margin-top:4px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.lvl{position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:14px;background:#fff;color:#1B2A44;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(8deg);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.lvl b{font-family:var(--font-display);font-size:22px;line-height:1;font-weight:400}
.lvl small{font-size:9px;font-weight:900;letter-spacing:.1em}
.bulbs{position:absolute;left:14px;right:14px;bottom:7px;display:flex;justify-content:space-between;pointer-events:none}
.bulbs b{width:6px;height:6px;border-radius:50%;background:#FFF6C7;box-shadow:0 0 6px 1px #FFE066;animation:bulb 1.1s infinite steps(1)}
.bulbs b:nth-child(even){animation-delay:.55s}
@keyframes bulb{0%{opacity:1}50%{opacity:.2}}

.notice{margin-top:12px;background:rgba(91,192,255,.12);border:1px solid rgba(91,192,255,.4);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.45}
.notice b{color:var(--sky)}

/* mode cards */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.mode{border-radius:22px;padding:14px;text-align:left;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;position:relative;overflow:hidden;box-shadow:0 6px 0 var(--sh);transition:transform .08s,box-shadow .08s;color:#fff;min-width:0}
.mode:active{transform:translateY(5px);box-shadow:0 1px 0 var(--sh)}
.mode::before{content:"";position:absolute;width:140px;height:140px;border-radius:50%;right:-50px;top:-60px;background:rgba(255,255,255,.12)}
.mode .big{font-size:36px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.mode h3{font-family:var(--font-display);font-weight:400;font-size:23px;margin:0;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.mode p{margin:3px 0 0;font-size:12.5px;font-weight:800;opacity:.92;line-height:1.3}
.mode-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.m-duel{background:linear-gradient(150deg,#FF6B57,#E2365A);--sh:#8F1C33;grid-column:1/-1;min-height:118px}
.m-topic{background:linear-gradient(150deg,#3D8BFF,#2753C9);--sh:#162F7A}
.m-math{background:linear-gradient(150deg,#22C98A,#11865E);--sh:#0A4F37}
.m-tower{background:linear-gradient(150deg,#FFC53D,#F0861A);--sh:#8A4C00;color:#2A1700;grid-column:1/-1}
.m-solo{background:linear-gradient(150deg,#9B6BFF,#5B3BD1);--sh:#2E1C7A;grid-column:1/-1}
.srcs{display:grid;gap:8px;margin-top:4px}
.src{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:13.5px;font-weight:900}
.src .bar{height:12px;border-radius:7px;background:var(--surface);overflow:hidden}
.src .bar i{display:block;height:100%;border-radius:7px;background:var(--c)}
.src .v{font-variant-numeric:tabular-nums;color:var(--muted);min-width:56px;text-align:right}
.m-tower h3{text-shadow:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:900;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.22);white-space:nowrap}
.pill.hot{background:#fff;color:#D02C4C;animation:wiggle 1.6s infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}}

/* online strip, lists */
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:62px;font-size:11.5px;font-weight:800}
.pchip .av{width:54px;height:54px;border-radius:50%;overflow:hidden;border:3px solid var(--surface-2);position:relative}
.pchip span{max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ondot{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--mint);border:2px solid var(--bg);right:0;bottom:0}
.avwrap{position:relative;flex:none}
.avwrap .ondot{right:-1px;bottom:-1px}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:10px 12px;text-align:left;width:100%;border:2px solid transparent;transition:transform .08s}
.row:active{transform:scale(.98)}
.row.turn{border-color:var(--gold);background:linear-gradient(90deg,rgba(255,197,61,.16),var(--surface) 70%)}
.row.me{border-color:rgba(255,197,61,.5)}
.row .av{width:46px;height:46px;border-radius:50%;overflow:hidden}
.row .mid{flex:1;min-width:0}
.row .t1{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--muted);font-weight:800;margin-top:1px}
.row .end{flex:none;text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;font-weight:900;padding:4px 9px;border-radius:99px;background:var(--surface-2);white-space:nowrap}
.tag.go{background:var(--gold);color:#2A1700}
.tag.win{background:var(--mint);color:#06281A}
.tag.lose{background:var(--red);color:#fff}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.empty b{color:var(--ink)}

/* category grid */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{position:relative;border-radius:20px;padding:14px 12px 12px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 0 var(--shadow);border:2px solid var(--line);transition:transform .08s,box-shadow .08s;min-width:0;overflow:hidden}
.cat:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.cat .ce{font-size:34px;line-height:1;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent)}
.cat .cn{font-weight:900;font-size:15.5px;line-height:1.2}
.cat .cc{font-size:12px;color:var(--muted);font-weight:800}
.cat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--c)}

/* math stages */
.stage{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:18px;padding:12px 14px;text-align:left;width:100%;border:2px solid var(--line);box-shadow:0 5px 0 var(--shadow)}
.stage:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.stage .num{flex:none;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-family:var(--font-display);font-size:24px;background:var(--mint);color:#06281A}
.stage.locked .num{background:var(--surface-2);color:var(--muted)}
.stage.locked{opacity:.65}
.stage .mid{flex:1;min-width:0}
.stage .t1{font-weight:900}
.stage .t2{font-size:13px;color:var(--muted);font-weight:800}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;justify-content:space-between}
.xbtn{flex:none;width:42px;height:42px;border-radius:13px;background:var(--surface);display:grid;place-items:center;font-size:18px;border:2px solid var(--line)}
.qlabel{flex:1;min-width:0;text-align:center;font-family:var(--font-display);font-size:18px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{display:flex;gap:3px;flex:none}
.heart{width:26px;height:24px;display:block}
.heart.lost{opacity:.25;filter:grayscale(1)}
.heart.pop{animation:heartLose .6s}
@keyframes heartLose{0%{transform:scale(1)}30%{transform:scale(1.6) rotate(-15deg)}100%{transform:scale(1)}}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.score{font-family:var(--font-display);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.streak{font-weight:900;font-size:14px;color:var(--coral)}
.pips{display:flex;gap:5px}
.pip{width:20px;height:7px;border-radius:4px;background:var(--surface-2)}
.pip.y{background:var(--mint)}.pip.n{background:var(--red)}.pip.c{background:var(--gold)}
.qcard{margin-top:12px;background:var(--surface);border-radius:24px;padding:16px;position:relative;box-shadow:0 7px 0 var(--shadow);border:2px solid var(--line);animation:cardIn .5s cubic-bezier(.2,1.4,.4,1)}
.qcard.shake{animation:shake .45s}
@keyframes cardIn{from{transform:translateY(24px) scale(.94) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qcat{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;padding:6px 10px;border-radius:99px;background:color-mix(in srgb,var(--c,#FFC53D) 20%,transparent);color:var(--c,#FFC53D);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{font-size:13px;letter-spacing:1px;flex:none;color:var(--gold)}
.stars i{font-style:normal;opacity:.25}
.qtext{font-weight:900;font-size:clamp(20px,5.6vw,25px);line-height:1.28;margin:14px 0 2px;text-wrap:balance}
.qtext.math{font-family:var(--font-display);font-weight:400;font-size:clamp(38px,12vw,54px);text-align:center;letter-spacing:1px;margin:18px 0 6px;font-variant-numeric:tabular-nums}
.timer{height:10px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:14px}
.tbar{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,var(--coral),var(--gold) 50%,var(--mint));animation:tmr linear forwards}
.timer.hurry .tbar{animation-name:tmr,flash;animation-duration:inherit,.4s;animation-iteration-count:1,infinite}
.timer.stop .tbar{animation-play-state:paused}
@keyframes tmr{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes flash{50%{filter:brightness(1.8)}}
.answers{display:grid;gap:10px;margin-top:16px}
.ans{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:60px;padding:10px 12px;border-radius:18px;background:var(--surface-2);border:2px solid var(--line);box-shadow:0 5px 0 var(--shadow);font-weight:900;font-size:17px;line-height:1.25;transition:transform .08s,background .2s,opacity .2s;animation:ansIn .45s cubic-bezier(.2,1.4,.4,1) backwards;position:relative}
.ans:nth-child(2){animation-delay:.06s}.ans:nth-child(3){animation-delay:.12s}.ans:nth-child(4){animation-delay:.18s}
@keyframes ansIn{from{transform:translateX(-18px);opacity:0}to{transform:none;opacity:1}}
.ans:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.ans .L{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-family:var(--font-display);font-weight:400;font-size:18px;background:rgba(255,255,255,.1)}
.ans .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.ans.ok{background:var(--mint);border-color:var(--mint);color:#06281A;box-shadow:0 5px 0 var(--mint-deep);animation:pop .45s}
.ans.bad{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 5px 0 var(--red-deep);animation:shake .45s}
.ans.dim{opacity:.4}
.ans .opp{flex:none;width:32px;height:32px;border-radius:50%;overflow:hidden;border:3px solid #fff;animation:pop .4s}
.answers.math{grid-template-columns:1fr 1fr}
.answers.math .ans{justify-content:center;font-family:var(--font-display);font-weight:400;font-size:26px;min-height:72px}
.answers.math .ans .L{display:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.timeout{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-family:var(--font-display);padding:6px 14px;border-radius:99px;font-size:16px;animation:pop .4s;white-space:nowrap}
.floatpts{position:fixed;z-index:60;font-family:var(--font-display);font-size:30px;color:var(--gold);text-shadow:0 3px 0 #6E4600;pointer-events:none;animation:ptsUp 1s ease-out forwards}
@keyframes ptsUp{from{transform:translate(-50%,0) scale(.6);opacity:0}25%{transform:translate(-50%,-18px) scale(1.2);opacity:1}to{transform:translate(-50%,-70px) scale(1);opacity:0}}
.floorban{position:fixed;left:50%;top:38%;z-index:55;transform:translate(-50%,-50%);font-family:var(--font-display);font-size:40px;color:var(--gold);text-shadow:0 4px 0 #6E4600,0 0 30px rgba(255,197,61,.5);text-align:center;pointer-events:none;animation:floorIn 1.6s forwards;white-space:nowrap}
.floorban small{display:block;font-size:18px;color:var(--ink);text-shadow:0 2px 0 var(--shadow)}
@keyframes floorIn{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%);opacity:0}}

/* duel */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;margin-top:6px}
.fighter{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;position:relative}
.fighter .av{width:76px;height:76px;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.fighter.hit .av{animation:shake .5s}
.fname{font-weight:900;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp{width:100%;height:16px;background:var(--bg2);border-radius:9px;overflow:hidden;border:2px solid #07101C;position:relative}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#3DDC97,#A6F06B);transition:width 1.1s cubic-bezier(.3,.9,.3,1);border-radius:7px}
.hp.mid i{background:linear-gradient(90deg,#FFC53D,#FFE07A)}
.hp.low i{background:linear-gradient(90deg,#FF4D6D,#FF8A5B)}
.hpn{font-family:var(--font-display);font-size:15px;font-variant-numeric:tabular-nums}
.vsb{font-family:var(--font-display);font-size:30px;color:var(--gold);text-shadow:0 3px 0 #6E4600;animation:vsPulse 1.8s infinite;align-self:center;padding-bottom:28px}
@keyframes vsPulse{50%{transform:scale(1.15) rotate(-4deg)}}
.dmgf{position:absolute;top:10px;left:50%;font-family:var(--font-display);font-size:30px;color:var(--red);text-shadow:0 3px 0 #5A0B1B;pointer-events:none;animation:ptsUp 1.4s ease-out forwards}
.dstatus{margin-top:14px;text-align:center;font-weight:900;color:var(--muted);font-size:14px}
.rounds{display:grid;gap:8px;margin-top:14px}
.round{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--surface);border-radius:16px;padding:9px 12px}
.round.cur{border:2px solid var(--gold)}
.dots{display:flex;gap:6px;align-items:center;min-width:0}
.dots.r{justify-content:flex-end}
.dot{width:20px;height:20px;border-radius:50%;background:var(--bg2);border:2px solid var(--line);flex:none}
.dot.y{background:var(--mint);border-color:var(--mint-deep)}
.dot.n{background:var(--red);border-color:var(--red-deep)}
.dot.h{background:repeating-linear-gradient(45deg,#2D4A73 0 3px,#203A5E 3px 6px)}
.rdmg{font-family:var(--font-display);font-size:13px;color:var(--red);margin:0 2px}
.rmid{text-align:center;font-size:10.5px;font-weight:900;color:var(--muted);line-height:1.2;min-width:62px}
.rmid .ce{font-size:20px;display:block}
.dact{margin-top:16px;display:grid;gap:10px}
.waiting{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);border-radius:16px;padding:14px;font-weight:900;color:var(--muted)}
.hg{display:inline-block;animation:hg 2s infinite}
@keyframes hg{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(180deg)}100%{transform:rotate(180deg)}}

/* pick */
.pickwrap{display:grid;gap:14px;margin-top:16px}
.pickc{display:flex;align-items:center;gap:16px;border-radius:22px;padding:16px;background:var(--surface);border:3px solid var(--c);box-shadow:0 6px 0 var(--shadow);text-align:left;animation:ansIn .5s cubic-bezier(.2,1.4,.4,1) backwards}
.pickc:nth-child(2){animation-delay:.08s}.pickc:nth-child(3){animation-delay:.16s}
.pickc:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.pickc .ce{font-size:44px;width:70px;height:70px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);flex:none}
.pickc .cn{font-family:var(--font-display);font-size:23px;line-height:1.1}
.pickc .cs{font-size:13px;color:var(--muted);font-weight:800;margin-top:3px}

/* emoji + chat */
.emobar{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.emobar::-webkit-scrollbar{display:none}
.emo{flex:none;width:44px;height:44px;border-radius:14px;background:var(--surface-2);font-size:24px;display:grid;place-items:center;transition:transform .1s}
.emo:active{transform:scale(.8) rotate(-8deg)}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%;animation:msgIn .3s ease-out}
@keyframes msgIn{from{transform:translateY(8px);opacity:0}}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.msg .av{flex:none;width:34px;height:34px;border-radius:50%;overflow:hidden}
.mcol{min-width:0;display:flex;flex-direction:column;gap:2px}
.msg.me .mcol{align-items:flex-end}
.mname{font-size:11.5px;font-weight:900;color:var(--muted);padding:0 4px}
.bubble{background:var(--surface-2);padding:9px 13px;border-radius:18px 18px 18px 5px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.msg.me .bubble{background:var(--gold);color:#2A1700;border-radius:18px 18px 5px 18px}
.bubble.e{background:none!important;font-size:42px;padding:0;line-height:1.1}
.composer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;background:linear-gradient(rgba(14,26,43,0),var(--bg) 22%)}
.composer .in{max-width:528px;margin:0 auto}
.crow{display:flex;gap:8px;align-items:center}
.crow .inp{flex:1;min-width:0}
.sendb{flex:none;width:52px;height:52px;border-radius:16px;background:var(--gold);color:#2A1700;font-size:22px;box-shadow:0 4px 0 var(--gold-deep);display:grid;place-items:center}
.sendb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep)}
.dchat{margin-top:18px;background:var(--surface);border-radius:20px;padding:12px}
.dchat .msgs{max-height:260px;overflow-y:auto;padding:4px 2px 8px}
.dchat .crow{margin-top:6px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.fly{position:absolute;bottom:-70px;font-size:58px;animation:fly 2.8s cubic-bezier(.2,.7,.3,1) forwards;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
@keyframes fly{0%{transform:translateY(0) scale(.5) rotate(0)}18%{transform:translateY(-28vh) scale(1.35) rotate(-12deg)}100%{transform:translateY(-115vh) scale(1) rotate(14deg);opacity:.2}}
.conf{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* inputs */
.inp{width:100%;font:inherit;font-weight:800;font-size:17px;padding:13px 15px;border-radius:16px;background:var(--bg2);border:2px solid var(--line);color:var(--ink);min-height:52px}
.inp::placeholder{color:#6F86A5}
.inp:focus{outline:none;border-color:var(--gold)}
.lbl{display:block;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}

/* onboarding + editor */
.hero-logo{font-family:var(--font-display);font-size:clamp(40px,12vw,58px);line-height:.95;text-align:center;color:var(--gold);text-shadow:0 5px 0 #6E4600;margin-top:14px;letter-spacing:1px;animation:cardIn .7s cubic-bezier(.2,1.4,.4,1)}
.hero-logo span{display:block;color:var(--ink);text-shadow:0 5px 0 var(--shadow)}
.marquee{display:flex;justify-content:center;gap:12px;margin:12px 0 4px}
.marquee b{width:9px;height:9px;border-radius:50%;background:#FFF6C7;box-shadow:0 0 8px 2px #FFD84D;animation:bulb 1.1s infinite steps(1)}
.marquee b:nth-child(even){animation-delay:.55s}
.lead{text-align:center;color:var(--muted);font-size:15px;line-height:1.5;margin:8px auto 0;max-width:34ch}
.editor{margin-top:6px}
.prevwrap{display:flex;justify-content:center;margin:10px 0 14px;position:relative}
.preview{width:150px;height:150px;border-radius:50%;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.preview.bump{animation:bump .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(.88) rotate(-4deg)}100%{transform:none}}
.dice{position:absolute;right:calc(50% - 112px);bottom:4px;width:50px;height:50px;border-radius:50%;background:var(--coral);font-size:24px;display:grid;place-items:center;box-shadow:0 4px 0 var(--coral-deep)}
.dice:active{transform:translateY(3px) rotate(40deg);box-shadow:0 1px 0 var(--coral-deep)}
.etabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.etabs::-webkit-scrollbar{display:none}
.etab{flex:none;padding:9px 13px;border-radius:99px;background:var(--surface);font-weight:900;font-size:13.5px;border:2px solid var(--line)}
.etab.on{background:var(--gold);color:#2A1700;border-color:var(--gold)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:9px;margin-top:8px}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--muted);min-width:0}
.opt .th{width:100%;aspect-ratio:1;max-width:100%;border-radius:18px;overflow:hidden;border:3px solid transparent;background:var(--surface)}
.opt.on .th{border-color:var(--gold)}
.opt.on{color:var(--gold)}
.opt span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:100%;aspect-ratio:1;border-radius:50%;border:4px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.opt.on .sw{box-shadow:0 0 0 3px var(--gold)}

/* profile, board */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--surface);border-radius:16px;padding:12px 8px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--font-display);font-weight:400;font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);font-weight:800}
.bpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bp{aspect-ratio:1.4;border-radius:14px;border:3px solid transparent;position:relative;display:grid;place-items:center;font-size:18px;max-width:100%}
.bp.on{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
.bp .lk{position:absolute;inset:0;border-radius:11px;background:rgba(8,17,31,.65);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--ink)}
.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;gap:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:9px 10px;border-radius:11px;font-weight:900;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--gold);color:#2A1700}
.rank{flex:none;width:30px;text-align:center;font-family:var(--font-display);font-size:19px;color:var(--muted)}
.rank.m{font-size:26px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:16px;padding:12px 14px;width:100%;font-weight:900;text-align:left}
.sw2{flex:none;width:52px;height:30px;border-radius:15px;background:var(--surface-2);position:relative;transition:background .2s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on .sw2{background:var(--mint)}
.toggle.on .sw2::after{transform:translateX(22px)}

/* results */
.res{text-align:center;padding-top:16px}
.res .bigemo{font-size:84px;line-height:1;animation:bump .7s cubic-bezier(.2,1.6,.4,1)}
.res h1{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,10vw,46px);margin:10px 0 4px;color:var(--gold);text-shadow:0 4px 0 #6E4600;line-height:1.05;text-wrap:balance}
.res .sub{color:var(--muted);font-weight:800;font-size:15px}
.res .pts{display:inline-block;margin-top:16px;font-family:var(--font-display);font-size:44px;background:var(--surface);border-radius:20px;padding:8px 22px;font-variant-numeric:tabular-nums}
.res .pts small{display:block;font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.res .stats{text-align:center}
.res .acts{display:grid;gap:12px;margin-top:22px}
.newrec{display:inline-block;margin-top:12px;background:var(--coral);color:#fff;font-weight:900;padding:6px 14px;border-radius:99px;animation:wiggle 1.4s infinite}

/* overlays + toast */
.ovl{position:fixed;inset:0;z-index:40;background:rgba(5,10,20,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:440px;background:var(--surface);border-radius:26px;padding:20px;border:2px solid var(--line);animation:sheetIn .45s cubic-bezier(.2,1.4,.4,1);max-height:100%;overflow:auto;box-shadow:0 10px 0 var(--shadow)}
@keyframes sheetIn{from{transform:translateY(40px) scale(.92);opacity:0}}
.sheet h3{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0 0 6px;text-align:center;line-height:1.1}
.sheet p{color:var(--muted);text-align:center;margin:0 0 14px;line-height:1.45}
.sheet .acts{display:grid;gap:10px;margin-top:16px}
.rs{display:grid;gap:8px;margin-top:10px}
.rsq{background:var(--bg2);border-radius:14px;padding:10px 12px}
.rsq .q{font-weight:800;font-size:14px;line-height:1.35}
.rsq .a{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:13px;font-weight:900}
.ok-t{color:var(--mint)}.bad-t{color:var(--red)}
.lvlup{text-align:center}
.lvlup .n{font-family:var(--font-display);font-size:90px;line-height:1;color:var(--gold);text-shadow:0 6px 0 #6E4600;animation:bump .8s cubic-bezier(.2,1.6,.4,1)}
#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{pointer-events:auto;max-width:440px;width:100%;display:flex;align-items:center;gap:10px;background:#F5F0E6;color:#14223A;border-radius:18px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45);font-weight:900;font-size:14.5px;animation:toastIn .45s cubic-bezier(.2,1.4,.4,1)}
.toast .av{flex:none;width:36px;height:36px;border-radius:50%;overflow:hidden}
.toast .tx{flex:1;min-width:0}
.toast .btn{min-height:38px;font-size:15px;padding:6px 12px;border-radius:12px}
@keyframes toastIn{from{transform:translateY(-30px);opacity:0}}
.loading{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.spinq{font-size:56px;animation:spinq 1.2s infinite cubic-bezier(.5,0,.5,1)}
@keyframes spinq{50%{transform:rotate(180deg) scale(1.2)}100%{transform:rotate(360deg)}}
.prop{transform-box:fill-box;transform-origin:center;animation:prop .45s linear infinite}
@keyframes prop{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
/* Live-Duell */
.livebadge{flex:none;font-size:12px;font-weight:900;letter-spacing:.08em;color:#fff;background:var(--red);padding:6px 10px;border-radius:99px;animation:livepulse 1.4s infinite}
@keyframes livepulse{50%{box-shadow:0 0 0 6px rgba(255,77,109,0)}0%{box-shadow:0 0 0 0 rgba(255,77,109,.55)}}
.oppstat{font-size:11.5px;font-weight:900;color:var(--muted);min-height:16px;text-align:center}
.oppstat.done{color:var(--mint)}
.waitav{display:grid;place-items:center;font-size:30px;background:var(--surface-2)}
.ans.picked{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--surface-2));box-shadow:0 5px 0 var(--gold-deep)}
.ans .opp.me{border-color:var(--gold)}
.livewait{margin-top:12px;text-align:center;font-weight:900;color:var(--muted);animation:fade .3s}
.revline{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-weight:900;font-size:14px;background:var(--surface);border-radius:14px;padding:10px 12px}
.livemsg{text-align:center;padding:26px 6px 10px}
.livemsg .bigemo{font-size:64px;line-height:1}
.livemsg h3{font-family:var(--font-display);font-weight:400;font-size:26px;margin:10px 0 6px;text-wrap:balance}
.livemsg p{color:var(--muted);line-height:1.45;margin:0 auto 6px;max-width:34ch}
.livemsg .acts{display:grid;gap:10px;margin-top:16px}
.liveround{margin-top:16px;text-align:center;background:var(--surface);border-radius:22px;padding:18px 14px;animation:cardIn .5s cubic-bezier(.2,1.4,.4,1)}
.liveround h3{font-family:var(--font-display);font-weight:400;font-size:28px;margin:6px 0;color:var(--gold)}
.rscore{display:flex;justify-content:center;align-items:center;gap:14px;font-family:var(--font-display);font-size:52px}
.rscore small{font-size:30px;color:var(--muted)}
.wheel{display:flex;justify-content:center;gap:16px;margin-top:22px;font-size:46px}
.wheel span{animation:wheel 1.2s infinite}
.wheel span:nth-child(2){animation-delay:.2s}.wheel span:nth-child(3){animation-delay:.4s}
@keyframes wheel{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.15)}}
.livedock{margin-top:16px;background:var(--surface);border-radius:20px;padding:10px}
.livelog{max-height:110px;overflow-y:auto;font-size:13.5px;line-height:1.4;padding:2px 4px 8px;display:grid;gap:3px}
.livelog .ll{overflow-wrap:anywhere}.livelog .ll b{color:var(--sky)}.livelog .ll.me b{color:var(--gold)}
.livedock .crow{margin-top:6px}
.livedock .inp{min-height:46px;padding:10px 13px}
.livedock .sendb{width:46px;height:46px}
.fighter{overflow:visible}
.sbub{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:5;max-width:150px;background:#F5F0E6;color:#14223A;font-weight:800;font-size:13px;line-height:1.3;padding:7px 10px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.4);animation:bubIn .35s cubic-bezier(.2,1.5,.4,1);overflow-wrap:anywhere;text-align:center;pointer-events:none}
.sbub::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#F5F0E6}
.sbub.e{background:none;box-shadow:none;font-size:40px;padding:0;top:-20px}.sbub.e::after{display:none}
@keyframes bubIn{from{transform:translateX(-50%) scale(.4);opacity:0}}
.liveinv{width:104px;height:104px;margin:0 auto 12px;border-radius:50%;overflow:hidden;border:4px solid #fff;animation:wiggle 1.2s infinite}
.rbtns{display:flex;gap:6px;flex:none}
.rbtns .btn.small{min-height:38px;padding:6px 10px}
/* Chat-Leiste unten (Live + Party) */
body.withbar #view{padding-bottom:calc(108px + env(safe-area-inset-bottom,0px))}
.gbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,21,36,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.gbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px}
.gbar-emo{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gbar-emo::-webkit-scrollbar{display:none}
.gbar-emo .emo{width:46px;height:46px;font-size:25px;flex:none}
.gbar-chat{flex:none;position:relative;display:flex;align-items:center;gap:6px;height:50px;padding:0 16px;border-radius:16px;background:var(--gold);color:#2A1700;font-weight:900;font-size:22px;box-shadow:0 4px 0 var(--gold-deep)}
.gbar-chat:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep)}

function prepQ(raw,cat){const opts=shuffle([raw[2],raw[3],raw[4],raw[5]]);return{q:raw[1],a:opts,c:opts.indexOf(raw[2]),d:raw[0],cat}}
function bankQ(cat,d,used){
 const all=Q[cat];let pool=all.filter(x=>x[0]===d&&!used.has(x[1]));
 if(!pool.length)pool=all.filter(x=>!used.has(x[1]));
 if(!pool.length)pool=all;
 const raw=pick(pool);used.add(raw[1]);return prepQ(raw,cat);
}
function numDistractors(ans,hints){
 const ok=v=>Number.isInteger(v)&&v>0&&v!==ans;
 const out=[];const add=v=>{if(ok(v)&&!out.includes(v))out.push(v)};
 shuffle(hints).forEach(v=>{if(out.length<2)add(v)});
 shuffle([ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+5,ans-5]).forEach(v=>{if(out.length<3)add(v)});
 let k=3;while(out.length<3){add(ans+k);k++}
 return out;
}
const swapDigits=n=>{const s=String(n);return s.length===2&&s[0]!==s[1]&&s[1]!=='0'?Number(s[1]+s[0]):-1};
function mathQ(level){
 let text,ans,hints=[];
 const mul=(a,b)=>{text=`${a} × ${b}`;ans=a*b;hints=[(a+1)*b,(a-1)*b,a*(b+1),a*(b-1),swapDigits(a*b),a+b]};
 const addsub=()=>{if(Math.random()<.5){const a=rnd(11,59),b=rnd(5,39);text=`${a} + ${b}`;ans=a+b;hints=[ans+10,ans-10,ans+1,ans-1,swapDigits(ans)]}else{const a=rnd(30,99),b=rnd(5,29);text=`${a} − ${b}`;ans=a-b;hints=[ans+10,ans-10,ans+1,ans-1,swapDigits(ans)]}};
 const div=(b,res)=>{const a=b*res;text=`${a} : ${b}`;ans=res;hints=[res+1,res-1,res+2,b===res?res+3:b]};
 switch(level){
  case 1:mul(rnd(1,5),rnd(1,5));break;
  case 2:mul(rnd(2,10),rnd(2,10));break;
  case 3:Math.random()<.5?mul(rnd(3,10),rnd(3,10)):div(rnd(2,10),rnd(2,10));break;
  case 4:addsub();break;
  default:{const r=Math.random();if(r<.35)mul(rnd(2,10),rnd(2,10));else if(r<.6)div(rnd(2,10),rnd(2,10));else addsub()}
 }
 const opts=shuffle([ans,...numDistractors(ans,hints)]);
 return{q:text+' = ?',a:opts.map(n=>fmt(n)),c:opts.indexOf(ans),d:level<=1?1:level<=3?2:3,cat:'mathe',math:true};
}
const mathLevelForDiff=d=>d===1?pick([1,2]):d===2?pick([2,3]):pick([3,4]);

const MAXR=10;const rk=i=>'r'+i;const roundDiff=i=>i<3?1:i<6?2:3;
const ansCount=(R,u)=>R&&R.ans&&R.ans[u]?Object.keys(R.ans[u]).length:0;
function corr(R,u){let c=0,t=0;const A=(R&&R.ans&&R.ans[u])||{};for(const k in A){if(A[k].ok){c++;t+=A[k].t||0}}return{c,t}}
function duelCalc(d){
 const [a,b]=d.players;const hp={[a]:100,[b]:100};const log=[];let r=0;
 for(;r<MAXR;r++){
  const R=d.rounds&&d.rounds[rk(r)];
  if(!R||ansCount(R,a)<3||ansCount(R,b)<3)break;
  const A=corr(R,a),B=corr(R,b);let da=0,db=0;
  if(A.c>B.c)db=4+7*(A.c-B.c)+r;
  else if(B.c>A.c)da=4+7*(B.c-A.c)+r;
  else if(A.c===0){da=db=5}
  hp[a]=Math.max(0,hp[a]-da);hp[b]=Math.max(0,hp[b]-db);log.push({[a]:da,[b]:db});
  if(hp[a]<=0||hp[b]<=0){r++;break}
 }
 const completed=r;
 const finished=d.status==='done'||hp[a]<=0||hp[b]<=0||completed>=MAXR;
 let winner=null;
 if(d.status==='done'&&d.winner)winner=d.winner;
 else if(finished)winner=hp[a]>hp[b]?a:hp[b]>hp[a]?b:'draw';
 let turn=null,action=null;
 if(!finished){const R=d.rounds&&d.rounds[rk(completed)];const picker=d.players[completed%2],other=d.players[(completed+1)%2];
  if(!R){turn=picker;action='pick'}else if(ansCount(R,picker)<3){turn=picker;action='play'}else{turn=other;action='play'}}
 return{hp,log,completed,finished,winner,turn,action,cur:completed};
}

 const qs=[];for(let i=0;i<3;i++){if(cat==='mathe'){let q;let g=0;do{q=mathQ(mathLevelForDiff(diff));g++}while(used.has(q.q)&&g<20);used.add(q.q);qs.push({q:q.q,a:q.a,c:q.c,m:1})}else{const q=bankQ(cat,diff,used);qs.push({q:q.q,a:q.a,c:q.c})}}
 return qs;

 const keep={};$$('#view input').forEach(i=>{if(i.id)keep[i.id]=i.value});
 const act=document.activeElement&&document.activeElement.id;const st=vw.scrollTop;
 renderTop();renderTabs();
 vw.innerHTML=(VIEWS[v.name]||VIEWS.home)(v);
 for(const id in keep){const el=document.getElementById(id);if(el&&!el.value)el.value=keep[id]}
 if(act){const el=document.getElementById(act);if(el&&el.tagName==='INPUT'){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}
 vw.scrollTop=scrollTop?0:st;

/* ============================================================
   SPIEL-SESSIONS

function startSession(cfg){
 clearTimers();
 G={...cfg,idx:cfg.startIdx||0,score:0,correct:0,answered:0,streak:0,bestStreak:0,lives:cfg.lives??null,maxLives:cfg.lives??null,used:new Set(),floor:1,level:1,hist:[],total:cfg.total||0,q:null,locked:false};
 nextQ();
}
function makeNextQ(){
 const g=G;
 switch(g.mode){
  case'topic':{if(g.idx>=9)return null;const d=[1,1,1,2,2,2,3,3,3][g.idx];g.T=15;return g.cat==='mathe'?mathQ([1,1,2,2,3,3,4,4,5][g.idx]):bankQ(g.cat,d,g.used)}
  case'mathStage':{if(g.idx>=12)return null;g.T=15;let q,k=0;do{q=mathQ(g.stage);k++}while(g.used.has(q.q)&&k<15);g.used.add(q.q);return q}
  case'mathEndless':{const lv=Math.min(5,1+Math.floor(g.idx/5));g.T=Math.max(6,15-Math.floor(g.idx/5));g.level=lv;return mathQ(lv)}
  case'tower':{const f=1+Math.floor(g.idx/5);g.floor=f;const d=f===1?1:f===2?pick([1,2]):f===3?2:f===4?pick([2,3]):3;g.T=f<5?15:f<7?12:10;return bankQ(pick(BANK_CATS).id,d,g.used)}
  case'solo':{if(g.idx>=10)return null;const L=levelFor(S.me.points);const base=L<3?1:L<7?2:3;
   const d=Math.max(1,Math.min(3,base+(g.idx>=7?1:0)-(g.idx<3?1:0)));g.T=15;
   let cat;do{cat=pick(BANK_CATS).id}while(cat===g.lastCat);g.lastCat=cat;return bankQ(cat,d,g.used)}
  case'duel':{const d=getDuel(g.duelId);const R=d&&d.rounds&&d.rounds[rk(g.round)];if(!R||g.idx>=R.qs.length)return null;g.T=15;const q=R.qs[g.idx];return{q:q.q,a:q.a,c:q.c,math:!!q.m,cat:R.cat,d:R.d}}
 }
 return null;
}
function nextQ(){
 if(!G)return;
 if(G.lives!=null&&G.lives<=0)return endSession();
 const prevFloor=G.floor;
 const q=makeNextQ();if(!q)return endSession();
 G.q=q;G.locked=false;S.view={name:'quiz'};render(true);
 if(G.mode==='tower'&&G.floor>prevFloor){floorBanner(`Etage ${G.floor}!`,G.floor>=5?'Jetzt wird es richtig fies 😈':'Es wird schwerer …');beep('lvl')}
 if(G.mode==='mathEndless'&&G.idx>0&&G.idx%5===0){floorBanner(`Level ${Math.floor(G.idx/5)+1}!`,'Weniger Zeit ⚡');beep('lvl')}
}
function startTimer(){
 if(!G)return;clearTimers();const bar=$('#tbar');if(bar)bar.style.animationDuration=G.T+'s';
 G.qStart=performance.now();
 G.tm=setTimeout(()=>answer(-1),G.T*1000);
 G.th=setTimeout(()=>{const t=$('#timer');t&&t.classList.add('hurry')},Math.max(0,G.T-4)*1000);
}
function clearTimers(){if(G){clearTimeout(G.tm);clearTimeout(G.th)}}
async function answer(i){
 const g=G;if(!g||g.locked||!g.q)return;g.locked=true;clearTimers();
 const q=g.q;const t=Math.round(performance.now()-g.qStart);const ok=i===q.c;
 const tm=$('#timer');tm&&tm.classList.add('stop');
 const btns=$$('.ans');btns.forEach((b,bi)=>{b.disabled=true;if(bi===q.c)b.classList.add('ok');else if(bi===i)b.classList.add('bad');else b.classList.add('dim')});
 if(i===-1){const c=$('#qcard');if(c){const s=document.createElement('div');s.className='timeout';s.textContent='⏰ Zeit um!';c.appendChild(s)}}
 g.answered++;g.hist[g.idx]=ok?1:0;
 if(ok){
  g.correct++;g.streak++;g.bestStreak=Math.max(g.bestStreak,g.streak);statCat(q.cat);
  const left=Math.max(0,g.T-t/1000);let pts=10*q.d+Math.ceil(left);if(g.streak>=3)pts+=5;if(g.mode==='tower')pts=Math.round(pts*(1+(g.floor-1)*.1));
  g.score+=pts;floatPts(btns[i],'+'+pts);beep('ok');vib(25);
  if(g.streak===5||g.streak===10)floatEmoji('🔥',3);
 }else{
  g.streak=0;beep('bad');vib([70,40,70]);const c=$('#qcard');c&&c.classList.add('shake');
  if(g.lives!=null){g.lives--;const h=document.getElementById('h'+g.lives);if(h){h.classList.add('lost','pop')}}
 }
 if(g.mode==='duel'){
  const d=getDuel(g.duelId);const R=d.rounds[rk(g.round)];const opp=oppOf(d);
  const oa=R.ans&&R.ans[opp]&&R.ans[opp][g.idx];
  if(oa&&oa.i>=0&&btns[oa.i]){const s=document.createElement('span');s.className='opp';s.innerHTML=avatarSVG(getProfile(opp).avatar);btns[oa.i].appendChild(s)}
  duelUpdate(d,{rounds:{[rk(g.round)]:{ans:{[S.myId]:{[String(g.idx)]:{i,ok,t}}}}},updatedAt:Date.now()}).catch(e=>{writeFailed(e);toast('Antwort konnte nicht gespeichert werden.')});
 }
 await sleep(ok?950:1600);
 if(G!==g)return;
 g.idx++;nextQ();
}
async function endSession(quit){
 const g=G;if(!g)return;clearTimers();G=null;
 const before=levelFor(S.me.points);
 if(g.mode==='solo'&&g.idx>=10&&g.correct===10){g.score+=50;statsOf().soloPerfect=1}
 if(g.mode==='mathStage'&&g.stage===5&&g.correct>=10&&g.idx>=12)statsOf().mathAll=1;
 addPoints(g.mode,g.score);S.me.correct+=g.correct;S.me.answered+=g.answered;
 if(g.mode==='duel'){await saveProfile();return afterDuelRound(g)}
 S.me.games=(S.me.games||0)+1;
 const res={pts:g.score,rec:false,stats:[[g.correct+'/'+g.answered,'richtig'],['🔥 '+g.bestStreak,'beste Serie'],[(g.answered?Math.round(100*g.correct/g.answered):0)+'%','Trefferquote']]};
 if(g.mode==='solo'){const perfect=g.correct===10;res.emo=perfect?'💎':g.lives<=0?'💔':g.correct>=7?'🏅':'👍';res.title=perfect?'Perfekte Runde! +50 Bonus':g.lives<=0?'Keine Leben mehr':'Rangspiel beendet';res.sub=`Deine Rangpunkte jetzt: ${fmt(S.me.points)}`;if(g.score>(S.me.bestSolo||0)){S.me.bestSolo=g.score;res.rec=true}res.again={mode:'solo',lives:3,total:10}}
 if(g.mode==='topic'){const c=CAT[g.cat];const good=g.correct>=7;res.emo=good?'🏆':g.lives<=0?'💔':'👍';res.title=good?'Stark gespielt!':g.lives<=0?'Keine Leben mehr':'Geschafft!';res.sub=`${c.e} ${c.name}`;res.again={mode:'topic',cat:g.cat,lives:3,total:9}}
 if(g.mode==='tower'){const fl=g.floor;res.emo=fl>=6?'🏰':fl>=3?'🗼':'🧱';res.title=`Etage ${fl} erreicht`;res.sub=`${g.answered} Fragen überlebt`;if(fl>(S.me.bestTower||0)){S.me.bestTower=fl;res.rec=true}if(g.score>(S.me.bestTowerScore||0)){S.me.bestTowerScore=g.score;res.rec=true}res.again={mode:'tower',lives:3}}
 if(g.mode==='mathStage'){const pass=g.correct>=10&&g.idx>=12;res.emo=pass?'🧮':'😅';res.title=pass?`Stufe ${g.stage} geschafft!`:'Fast!';res.sub=pass?(g.stage<5?`Stufe ${g.stage+1} ist freigeschaltet`:'Du hast alle Stufen gemeistert'):'Mindestens 10 von 12 richtig schalten die nächste Stufe frei';if(pass&&g.stage>=(S.me.mathStage||1)&&g.stage<5){S.me.mathStage=g.stage+1;res.rec=true}res.again={mode:'mathStage',stage:g.stage,lives:3,total:12}}
 if(g.mode==='mathEndless'){res.emo='⚡';res.title=`Level ${Math.floor(Math.max(0,g.idx-1)/5)+1} erreicht`;res.sub=`${g.correct} Aufgaben richtig gelöst`;if(g.score>(S.me.bestMath||0)){S.me.bestMath=g.score;res.rec=true}res.again={mode:'mathEndless',lives:3}}
 await saveProfile();
 S.view={name:'result',res};render(true);
 if(res.rec||g.correct>=7){confetti(80);beep('win')}
 const after=levelFor(S.me.points);if(after>before)setTimeout(()=>levelUpFX(after),900);
}
async function afterDuelRound(g){
 const d=getDuel(g.duelId);if(!d){go({name:'home'});return}
 const round=g.round;
 if(d.bot)botTick(d);
 let st=duelCalc(d);const opp=oppOf(d);
 if(!d.bot&&st.turn===opp&&!st.finished)pingRoom({to:opp,duel:d.id,kind:'turn'});
 go({name:'duel',id:d.id});
 processDuels();
 showRoundSummary(d,round);
}
function showRoundSummary(d,round){
 const R=d.rounds[rk(round)];if(!R)return;const me=S.myId,opp=oppOf(d);const P=getProfile(opp);const st=duelCalc(d);
 const oppDone=ansCount(R,opp)>=3;const A=corr(R,me),B=corr(R,opp);
 let head,sub;
 if(st.finished){S.endShown.add(d.id);const w=st.winner;head=w===me?'🏆 Sieg!':w==='draw'?'🤝 Unentschieden':'💀 Niederlage';sub=w===me?`Du hast ${P.name} besiegt. +100 Punkte`:w==='draw'?'Gleichstand. +40 Punkte':`${P.name} gewinnt. +20 Punkte fürs Mitmachen`;if(w===me){confetti(120);beep('win')}}
 else if(oppDone){const lg=st.log[round]||{};const dm=lg[me]||0,do_=lg[opp]||0;head=do_>dm?'Runde gewonnen! 💥':dm>do_?'Runde verloren 😵':'Unentschieden';sub=`${A.c} : ${B.c} richtige Antworten`+(A.c===B.c&&A.c>0?' · keiner verliert Leben':'')}

const EST_T=20;
function estPick(cat,used){let pool=EST.filter(e=>e[0]===cat&&!used.has(e[1]));if(!pool.length)pool=EST.filter(e=>!used.has(e[1]));if(!pool.length)pool=EST;const e=pick(pool);used.add(e[1]);return{est:1,q:e[1],v:e[2],u:e[3],cat:e[0]}}
const fmtNum=v=>v==null||isNaN(v)?'–':Number(v).toLocaleString('de-DE',{maximumFractionDigits:3});
function parseNum(s){s=String(s??'').trim().replace(/\s/g,'').replace(/[^\d.,\-]/g,'');if(!s||s==='-')return null;
 if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}
 else if((s.match(/\./g)||[]).length>1){s=s.replace(/\./g,'')}
 else if(/^-?\d{1,3}\.\d{3}$/.test(s)){s=s.replace('.','')}
 const n=Number(s);return isFinite(n)?n:null}
function estJudge(vals,v){
 const out={};const arr=Object.entries(vals).filter(([,x])=>x!=null).map(([u,x])=>({u,x,d:Math.abs(x-v)}));
 arr.sort((a,b)=>a.d-b.d);let rank=0,prev=null;
 arr.forEach((e,i)=>{if(prev===null||e.d!==prev){rank=i+1;prev=e.d}out[e.u]={v:e.x,d:Math.round(e.d*1000)/1000,rank,ok:rank===1,exact:e.d===0}});
 for(const u in vals)if(!out[u])out[u]={v:null,d:null,rank:null,ok:false,exact:false};
 return out;
}

const PARTY_MAX=8,PARTY_QN=12,PARTY_T=15;
const PT={id:null,st:null,ans:{},unsub:[],timers:[],phaseKey:null,phaseLocal:0,busy:false,answered:{},msgs:[],qTimer:null,finished:false};
const partyDoc=id=>S.db.doc('party/'+id);
const partyAnsDoc=(id,u)=>S.db.doc('party/'+id+'/ans/'+u);

function partyURL(id){const base=STANDALONE?(location.origin+location.pathname):ARTIFACT_URL;return `${base}#party-${id}`}
function partyActive(u){if(u===S.myId)return true;const a=PT.ans[u];return !!a&&!a.left&&Date.now()-(a.seen||0)<20000}
function partyPlayers(){return PT.st?PT.st.players||[]:[]}
async function partyCreate(invite=[]){
 if(!S.online||S.readOnly){toast('Der Party-Modus geht nur online.');return}closeOverlay();
 const id=newPartyId(),now=Date.now();
 try{await serial(()=>partyDoc(id).set({host:S.myId,players:[S.myId],invited:invite.filter(u=>u!==S.myId).slice(0,20),status:'lobby',phase:'lobby',qi:0,scores:{[S.myId]:0},createdAt:now,updatedAt:now}))}

async function partyJoin(id){
 if(!S.online||S.readOnly){toast('Der Party-Modus geht nur online.');return}closeOverlay();
 try{const s=await partyDoc(id).get();if(!s.exists){toast('Diese Party gibt es nicht mehr.');return}
  const d=clone(s.data());
  if(!d.players.includes(S.myId)){
   if(d.status!=='lobby'){openOverlay(`<h3>Die Party läuft schon</h3><p>Diese Runde hat bereits begonnen. Frag den Host nach der nächsten Party.</p><div class="acts"><button class="btn block" data-a="closeOvl">Okay</button></div>`);return}

  }

async function openParty(id){
 closeParty();if(G){clearTimers();G=null}
 Object.assign(PT,{id,st:null,ans:{},phaseKey:null,busy:false,answered:{},msgs:[],finished:false});
 S.view={name:'party',id};render(true);
 try{const r=partyAnsDoc(id,S.myId);const s=await r.get();
  if(!s.exists)await serial(()=>r.set({uid:S.myId,seen:Date.now(),joined:Date.now(),a:{},msgs:[]}));
  else{const d=clone(s.data());PT.msgs=d.msgs||[];Object.keys(d.a||{}).forEach(k=>PT.answered[k]=true);await serial(()=>r.update({seen:Date.now(),left:false}))}
 }catch(e){}
 if(PT.id!==id)return;
 chatSetCtx({msgs:partyAllMsgs,send:partySend,bubble:null});
 PT.unsub.push(partyDoc(id).onSnapshot(s=>{if(PT.id!==id)return;if(!s.exists){PT.st=null;partyRender();return}PT.st=clone(s.data());onPartyState()},()=>{}));
 PT.unsub.push(S.db.collection('party/'+id+'/ans').onSnapshot(s=>{if(PT.id!==id)return;const m={};s.docs.forEach(d=>{m[d.id]=clone(d.data())});PT.ans=m;partyBits();chatUpdate();partyTick()},()=>{}));
 PT.timers.push(setInterval(()=>{if(PT.id===id)serial(()=>partyAnsDoc(id,S.myId).update({seen:Date.now()})).catch(()=>{})},5000));
 PT.timers.push(setInterval(partyTick,400));
}
function closeParty(){PT.unsub.forEach(u=>{try{u()}catch(e){}});PT.unsub=[];PT.timers.forEach(t=>clearInterval(t));PT.timers=[];clearTimeout(PT.qTimer);if(PT.id)chatSetCtx(null);PT.id=null;PT.st=null}
function partyAllMsgs(){const out=[];for(const u in PT.ans){const a=PT.ans[u];if(u===S.myId)continue;(a.msgs||[]).forEach(m=>out.push({...m,by:u}))}(PT.msgs||[]).forEach(m=>out.push({...m,by:S.myId}));return out.sort((a,b)=>a.ts-b.ts).slice(-60)}
function partySend(m){m={...m,ts:Date.now()};PT.msgs=[...(PT.msgs||[]),m].slice(-20);chatUpdate();serial(()=>partyAnsDoc(PT.id,S.myId).update({msgs:PT.msgs})).catch(()=>{})}
function onPartyState(){
 const st=PT.st;const k=[st.status,st.phase,st.qi].join('|');
 const rk=st.status==='lobby'?[(st.players||[]).join(','),(st.invited||[]).length,st.host].join('|'):st.host;
 if(k!==PT.phaseKey){PT.phaseKey=k;PT.renderKey=rk;PT.phaseLocal=Date.now();if(st.status==='done')partyFinish();partyRender();partyEnter()}
 else if(rk!==PT.renderKey){PT.renderKey=rk;partyRender()}else partyBits();
}
const partyQT=st=>st&&st.qs&&st.qs[st.qi]&&st.qs[st.qi].est?EST_T:PARTY_T;
function makePartyQs(){
 const used=new Set(),usedE=new Set();const diff=[1,1,1,0,2,2,2,0,3,3,3,0];const qs=[];
 for(let i=0;i<PARTY_QN;i++){const cat=pick(BANK_CATS).id;
  if(diff[i]===0){qs.push(estPick(cat,usedE))}else{const q=bankQ(cat,diff[i],used);qs.push({q:q.q,a:q.a,c:q.c,cat,d:diff[i]})}}
 return qs;
}
function partyTick(){
 const st=PT.st;if(!st||!PT.id)return;const me=S.myId,now=Date.now(),el=now-PT.phaseLocal;const pl=partyPlayers();
 // Host-Übergabe, falls der Host weg ist
 if(st.status!=='done'&&st.host!==me&&!partyActive(st.host)&&el>8000){const next=pl.find(u=>partyActive(u));if(next===me&&!PT.busy){PT.busy=true;serial(()=>partyDoc(PT.id).update({host:me,updatedAt:Date.now()})).catch(()=>{}).finally(()=>{PT.busy=false})}return}
 if(st.host!==me||PT.busy)return;
 const W=p=>{PT.busy=true;serial(()=>partyDoc(PT.id).update({...p,updatedAt:Date.now()})).catch(e=>writeFailed(e)).finally(()=>{PT.busy=false})};
 if(st.status==='lobby'){
  const joiners=Object.keys(PT.ans).filter(u=>!pl.includes(u)&&!PT.ans[u].left&&now-(PT.ans[u].seen||0)<20000);
  const leavers=pl.filter(u=>u!==me&&PT.ans[u]&&PT.ans[u].left);
  if((joiners.length&&pl.length<PARTY_MAX)||leavers.length){const np=[...pl.filter(u=>!leavers.includes(u)),...joiners].slice(0,PARTY_MAX);const sc={...(st.scores||{})};np.forEach(u=>{if(sc[u]==null)sc[u]=0});W({players:np,scores:sc});return}
  if(now-st.createdAt>60*60e3)W({status:'expired'});return}
 if(st.status!=='playing')return;
 const active=pl.filter(partyActive);
 switch(st.phase){
  case'q':{const q=st.qs[st.qi];const T=partyQT(st);const key=String(st.qi);
   const done=active.every(u=>PT.ans[u]&&PT.ans[u].a&&PT.ans[u].a[key]);
   if(done||el>(T+3)*1000){
    const rev={};const sc={...(st.scores||{})};
    if(q.est){const vals={};pl.forEach(u=>{const a=PT.ans[u]&&PT.ans[u].a&&PT.ans[u].a[key];vals[u]=a&&a.v!=null?a.v:null});
     const j=estJudge(vals,q.v);pl.forEach(u=>{const r=j[u];let pts=0;if(r.v!=null){pts=r.rank===1?150:r.rank===2?100:r.rank===3?70:40;if(r.exact)pts+=50}rev[u]={...r,pts};sc[u]=(sc[u]||0)+pts})}
    else{pl.forEach(u=>{const a=PT.ans[u]&&PT.ans[u].a&&PT.ans[u].a[key];const i=a?a.i:-1;const ok=i===q.c;const t=a?a.t:T*1000;const pts=ok?100+Math.round(50*Math.max(0,T*1000-t)/(T*1000)):0;rev[u]={i,ok,pts};sc[u]=(sc[u]||0)+pts})}
    W({phase:'rev',rev,prevScores:st.scores||{},scores:sc})}
   break}
  case'rev':if(el>(st.qs[st.qi].est?5000:3800))W({phase:'board'});break;
  case'board':if(el>3800){if(st.qi>=PARTY_QN-1)W({phase:'done',status:'done'});else W({phase:'q',qi:st.qi+1,rev:null})}break;
 }
}
function partyAnswer(i){
 const st=PT.st;if(!st||st.status!=='playing'||st.phase!=='q')return;const key=String(st.qi);if(PT.answered[key])return;
 PT.answered[key]=true;clearTimeout(PT.qTimer);const q=st.qs[st.qi];const T=PARTY_T;
 const t=Math.min(T*1000,Math.round(Date.now()-PT.qStartAbs));
 $$('.ans').forEach((b,bi)=>{b.disabled=true;if(bi===i)b.classList.add('picked');else b.classList.add('dim')});
 const tm=$('#timer');tm&&tm.classList.add('stop');const w=$('#ptWait');if(w)w.hidden=false;if(i>=0)beep('pick');
 if(i===q.c){statCat(q.cat);S.me.correct++}S.me.answered++;
 serial(()=>partyAnsDoc(PT.id,S.myId).update({a:{[key]:{i,t}},seen:Date.now()})).catch(e=>writeFailed(e));
}
function partyEst(v){
 const st=PT.st;if(!st||st.status!=='playing'||st.phase!=='q')return;const key=String(st.qi);if(PT.answered[key])return;
 if(v==null&&!PT.timeUp){toast('Bitte eine Zahl eingeben.');return}
 PT.answered[key]=true;clearTimeout(PT.qTimer);const t=Math.min(EST_T*1000,Math.round(Date.now()-PT.qStartAbs));
 serial(()=>partyAnsDoc(PT.id,S.myId).update({a:{[key]:{v,t}},seen:Date.now()})).catch(e=>writeFailed(e));
 beep('pick');partyRender();
}
function partyEnter(){
 const st=PT.st;if(!st)return;
 if(st.status==='playing'&&st.phase==='q'){const key=String(st.qi);const T=partyQT(st);const left=Math.max(0,T*1000-(Date.now()-PT.phaseLocal));PT.qStartAbs=Date.now()-(T*1000-left);PT.timeUp=false;
  if(!PT.answered[key])PT.qTimer=setTimeout(()=>{PT.timeUp=true;if(st.qs[st.qi].est){const i=$('#estIn');partyEst(parseNum(i?i.value:''))}else partyAnswer(-1)},left)}
 if(st.status==='playing'&&st.phase==='rev'){const r=st.rev&&st.rev[S.myId];if(r&&(r.ok||r.pts>0))beep('ok');else beep('bad');
  const q=st.qs[st.qi];if(q.est&&r){if(r.exact)statInc('estExact');if(r.ok)statInc('estWins');if(r.ok)statCat(q.cat)}}
 if(st.status==='lobby'&&st.phase==='lobby')beep('pop');
 if(st.status==='done')partyFinish();
}
function partyRanking(st){const sc=st.scores||{};return partyPlayers().slice().sort((a,b)=>(sc[b]||0)-(sc[a]||0))}
function partyFinish(){
 const st=PT.st;if(PT.finished||!S.me)return;PT.finished=true;if((S.me.countedDuels||[]).includes(PT.id))return;
 S.me.countedDuels=[...(S.me.countedDuels||[]),PT.id].slice(-300);
 const rk=partyRanking(st);const place=rk.indexOf(S.myId)+1;const my=(st.scores||{})[S.myId]||0;
 const bonus=place===1?60:place===2?35:place===3?20:10;const before=levelFor(S.me.points);
 addPoints('party',Math.round(my/20)+bonus);S.me.games=(S.me.games||0)+1;
 const s=statsOf();s.partyGames=(s.partyGames||0)+1;if(place===1&&rk.length>1)s.partyWins=(s.partyWins||0)+1;if(rk.length>=4)s.bigParty=1;
 if(place===1){confetti(160);beep('win')}
 saveProfile();const after=levelFor(S.me.points);if(after>before)setTimeout(()=>levelUpFX(after),2000);
 PT.earned=Math.round(my/20)+bonus;
}
function partyBits(){
 const st=PT.st;if(!st)return;
 const strip=$('#ptStrip');if(strip&&st.status==='playing'&&st.phase==='q'){const key=String(st.qi);
  partyPlayers().forEach(u=>{const el=strip.querySelector(`[data-u="${CSS.escape(u)}"]`);if(!el)return;const done=PT.ans[u]&&PT.ans[u].a&&PT.ans[u].a[key];el.classList.toggle('done',!!done);el.classList.toggle('gone',!partyActive(u))})}

   LIVE-DUELL (Echtzeit, beide spielen gleichzeitig)

const LIVE_ROUNDS=10,LIVE_Q=3,LIVE_T=15,PICK_T=12;
const L={id:null,st:null,ans:{},unsub:[],timers:[],phaseKey:null,phaseLocal:0,busy:false,myPick:null,used:new Set(),answered:{},pts:0,correct:0,answeredN:0,lastEmo:0,lastMsg:0,shownHp:null,msgs:[],qTimer:null};
const liveDoc=id=>S.db.doc('live/'+id);
const liveAnsDoc=(id,u)=>S.db.doc('live/'+id+'/ans/'+u);
const liveOpp=()=>L.st&&L.st.players?L.st.players.find(p=>p!==S.myId)||null:null;
const lkey=(r,q)=>r+'-'+q;
const newLiveId=()=>'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function canLive(){if(!S.online||S.readOnly){toast('Live-Duelle gehen nur online.');return false}return true}
function liveRoomURL(id){const base=STANDALONE?(location.origin+location.pathname):ARTIFACT_URL;return `${base}#live-${id}`}

 <button class="btn block" data-a="copyInvite">📋 Link kopieren</button>
 <a class="btn mint block" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(txt+' '+url)}" target="_blank" rel="noopener">💬 Per WhatsApp senden</a>

async function liveJoin(id){

function showLiveInvite(id,host){

 if(S.view.name==='live'||G){toast(`⚡ ${P.name} will LIVE gegen dich spielen!`,{av:P.avatar,btn:'Annehmen',act:'liveAccept',v:id,ms:30000});return}

async function openLive(id){
 closeLive();
 Object.assign(L,{id,st:null,ans:{},phaseKey:null,busy:false,myPick:null,answered:{},pts:0,correct:0,answeredN:0,lastEmo:Date.now(),lastMsg:Date.now(),shownHp:null,msgs:[]});
 S.view={name:'live',id};render(true);
 try{const r=liveAnsDoc(id,S.myId);const s=await r.get();
  if(!s.exists)await serial(()=>r.set({uid:S.myId,seen:Date.now(),a:{},pick:{},msgs:[]}));
  else{const d=clone(s.data());L.msgs=d.msgs||[];Object.keys(d.a||{}).forEach(k=>L.answered[k]=true);await serial(()=>r.update({seen:Date.now()}))}
 }catch(e){}
 if(L.id!==id)return;
 L.unsub.push(liveDoc(id).onSnapshot(s=>{if(L.id!==id)return;if(!s.exists){L.st=null;liveRender();return}L.st=clone(s.data());onLiveState()},()=>{}));
 L.unsub.push(S.db.collection('live/'+id+'/ans').onSnapshot(s=>{if(L.id!==id)return;const m={};s.docs.forEach(d=>{m[d.id]=clone(d.data())});L.ans=m;onLiveAns()},()=>{}));
 L.timers.push(setInterval(()=>{if(L.id===id)serial(()=>liveAnsDoc(id,S.myId).update({seen:Date.now()})).catch(()=>{})},5000));
 L.timers.push(setInterval(liveTick,400));
 chatSetCtx({msgs:liveAllMsgs,send:liveSend,bubble:m=>{if(m.e)liveBubble('opp',m.e,true)}});
}
function closeLive(){if(L.id)chatSetCtx(null);L.unsub.forEach(u=>{try{u()}catch(e){}});L.unsub=[];L.timers.forEach(t=>clearInterval(t));L.timers=[];clearTimeout(L.qTimer);L.id=null;L.st=null}

function onLiveState(){
 const st=L.st;const k=[st.status,st.phase,st.round,st.q].join('|');
 if(k!==L.phaseKey){L.phaseKey=k;L.phaseLocal=Date.now();L.myPick=null;liveRender();liveEnter()}
 else liveBits();
}
function onLiveAns(){liveBits();liveTick()}

function liveTick(){
 const st=L.st;if(!st||!L.id)return;const now=Date.now(),me=S.myId,opp=liveOpp(),el=now-L.phaseLocal;
 if(st.status==='playing'&&opp){const oa=L.ans[opp];const gone=!oa||now-(oa.seen||0)>30000;if(gone&&el>30000){liveEnd(me,'abandon');return}}
 if(st.host!==me||L.busy)return;
 const W=p=>{L.busy=true;serial(()=>liveDoc(L.id).update({...p,updatedAt:Date.now()})).catch(e=>writeFailed(e)).finally(()=>{L.busy=false})};
 if(st.status==='invite'){if(now-st.createdAt>60000)W({status:'expired'});return}
 if(st.status==='waiting'){if(now-st.createdAt>30*60e3)W({status:'expired'});return}
 if(st.status==='accepted'){const [a,b]=st.players;if(!b)return;W({status:'playing',phase:'pick',round:0,q:0,picker:a,offer:offerCats(),log:[],hp:{[a]:100,[b]:100}});return}
 if(st.status!=='playing')return;
 switch(st.phase){
  case'pick':{const pk=st.picker;const ch=pk===me?L.myPick:(L.ans[pk]&&L.ans[pk].pick&&L.ans[pk].pick[st.round]);const valid=ch&&(st.offer||[]).includes(ch);
   if(valid||el>(PICK_T+1)*1000){const cat=valid?ch:pick(st.offer||offerCats());const d=roundDiff(st.round);W({phase:'q',cat,d,qs:makeLiveQs(cat,d,st.round),q:0,rev:null})}break}
  case'q':{const key=lkey(st.round,st.q);const a=L.ans[me]&&L.ans[me].a&&L.ans[me].a[key],b=L.ans[opp]&&L.ans[opp].a&&L.ans[opp].a[key];const QQ=st.qs[st.q];const T=liveQT(st);
   if((a&&b)||el>(T+4)*1000){let rv;
    if(QQ.est){const j=estJudge({[me]:a&&a.v!=null?a.v:null,[opp]:b&&b.v!=null?b.v:null},QQ.v);rv={[me]:{...j[me],t:a?a.t:T*1000,i:-3},[opp]:{...j[opp],t:b?b.t:T*1000,i:-3}}}
    else{const TO={i:-1,ok:false,t:LIVE_T*1000};rv={[me]:a||TO,[opp]:b||TO}}
    W({phase:'rev',rev:rv,res:{[key]:rv}})}break}
  case'rev':if(el>(st.qs[st.q]&&st.qs[st.q].est?4800:2800)){if(st.q<LIVE_Q-1)W({phase:'q',q:st.q+1,rev:null});else{const dm=liveDamage(st,st.round);const hp={...st.hp};st.players.forEach(p=>hp[p]=Math.max(0,(hp[p]??100)-(dm[p]||0)));W({phase:'round',hp,log:[...(st.log||[]),dm],rev:null})}}break;
  case'round':if(el>4000){const over=st.round>=LIVE_ROUNDS-1||st.players.some(p=>(st.hp[p]??100)<=0);
   if(over){const [a,b]=st.players;const w=st.hp[a]>st.hp[b]?a:st.hp[b]>st.hp[a]?b:'draw';W({phase:'done',status:'done',winner:w,reason:'end'})}
   else W({phase:'pick',round:st.round+1,q:0,picker:st.players[(st.round+1)%2],offer:offerCats()})}break;
 }
}
function makeLiveQs(cat,d,round){const qs=[];for(let i=0;i<LIVE_Q;i++){if(i===LIVE_Q-1&&round%2===1){qs.push(estPick(cat,L.usedEst||(L.usedEst=new Set())));continue}const q=bankQ(cat,d,L.used);qs.push({q:q.q,a:q.a,c:q.c})}return qs}
const liveQT=st=>st&&st.qs&&st.qs[st.q]&&st.qs[st.q].est?EST_T:LIVE_T;
function liveDamage(st,r){
 const [a,b]=st.players;const A={c:0,t:0},B={c:0,t:0};
 for(let q=0;q<LIVE_Q;q++){const x=st.res&&st.res[lkey(r,q)];if(!x)continue;if(x[a]&&x[a].ok){A.c++;A.t+=x[a].t||0}if(x[b]&&x[b].ok){B.c++;B.t+=x[b].t||0}}
 let da=0,db=0;
 if(A.c>B.c)db=4+7*(A.c-B.c)+r;else if(B.c>A.c)da=4+7*(B.c-A.c)+r;else if(A.c===0){da=db=5}
 return{[a]:da,[b]:db,_c:{[a]:A.c,[b]:B.c}};
}
function liveEnd(w,reason){if(!L.id||!L.st||L.st.status==='done')return;serial(()=>liveDoc(L.id).update({status:'done',phase:'done',winner:w,reason,updatedAt:Date.now()})).catch(()=>{})}

function liveEst(v){
 const st=L.st;if(!st||st.status!=='playing'||st.phase!=='q')return;const key=lkey(st.round,st.q);if(L.answered[key])return;
 if(v==null&&!L.timeUp){toast('Bitte eine Zahl eingeben.');return}
 L.answered[key]=true;clearTimeout(L.qTimer);const t=Math.min(EST_T*1000,Math.round(Date.now()-L.qStartAbs));L.answeredN++;
 serial(()=>liveAnsDoc(L.id,S.myId).update({a:{[key]:{v,t}},seen:Date.now()})).catch(e=>writeFailed(e));beep('pick');liveRender();

/* ---------- Firebase-Anbindung (nur GitHub-Version) ---------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function fbAdapter(fs){
 const wQ=q=>({where:(f,o,v)=>wQ(q.where(f,o,v)),orderBy:(f,d)=>wQ(q.orderBy(f,d||'asc')),limit:n=>wQ(q.limit(n)),get:()=>q.get(),onSnapshot:(n,e)=>q.onSnapshot(n,e)});
 const wD=r=>({id:r.id,path:r.path,get:()=>r.get(),set:d=>r.set(d),update:d=>r.set(d,{merge:true}),delete:()=>r.delete(),onSnapshot:(n,e)=>r.onSnapshot(n,e),collection:p=>wC(r.collection(p))});
 const wC=c=>({...wQ(c),path:c.path,doc:id=>wD(id?c.doc(id):c.doc()),add:d=>c.add(d)});
 return{doc:p=>wD(fs.doc(p)),collection:p=>wC(fs.collection(p))};
}
function fbRoom(fs,uid){
 const ref=fs.collection('presence').doc(uid);let last=null;const subs=[];
 const beat=()=>ref.set({uid,at:Date.now()}).catch(()=>{});
 beat();setInterval(()=>{if(document.visibilityState==='visible')beat()},30000);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')beat()});
 addEventListener('pagehide',()=>{ref.set({uid,at:0}).catch(()=>{})});
 const emitPeers=()=>{if(!last)return;const now=Date.now();const peers=last.filter(p=>p&&now-p.at<80000).map(p=>({by:p.uid,isMe:p.uid===uid,presence:{uid:p.uid}}));subs.forEach(f=>f({peers}))};
 fs.collection('presence').where('at','>',Date.now()-6*3600e3).onSnapshot(s=>{last=s.docs.map(d=>d.data());emitPeers()},()=>{});
 setInterval(emitPeers,20000);
 return{onPeers(fn){subs.push(fn);setTimeout(emitPeers,0);return()=>{}},on(){return()=>{}},emit(){return Promise.resolve()},presence(){return Promise.resolve()}};
}
async function initFirebase(){
 const V='10.14.1';
 await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
 await Promise.all([loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`),loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`)]);
 firebase.initializeApp(FIREBASE_CONFIG);
 const auth=firebase.auth();
 const user=await new Promise(res=>{let done=false;const fin=u=>{if(!done){done=true;res(u)}};
  auth.onAuthStateChanged(u=>{if(u)fin(u);else auth.signInAnonymously().catch(e=>{console.error(e);S.fbError=e.code||e.message;fin(null)})});
  setTimeout(()=>fin(null),15000)});
 if(!user)return{};
 const fs=firebase.firestore();
 return{db:fbAdapter(fs),uid:user.uid,room:fbRoom(fs,user.uid)};
}

async function boot(){

  R.on('emoji',m=>{if(m.sameTab)return;const d=m.data||{};if(typeof d.e!=='string'||!EMOJIS.includes(d.e))return;if(d.id){if(S.seenMsg.has(d.id))return;S.seenMsg.add(d.id)}
   const c=String(d.ctx||'');if((c==='lobby'&&S.view.name==='chat')||(c==='duel:'+S.view.id&&S.view.name==='duel'))floatEmoji(d.e,3)},()=>{});
  R.presence({uid:S.myId}).catch(()=>{});
 }catch(e){}
}
async function cleanup(){
 if(!S.online||S.readOnly)return;
 try{const old=await S.db.collection('lobby').where('ts','<',Date.now()-14*864e5).limit(40).get();for(const d of old.docs)await serial(()=>S.db.doc('lobby/'+d.id).delete())}catch(e){}
 try{for(const d of Object.values(S.duels)){if(d.status==='done'&&(d.updatedAt||0)<Date.now()-21*864e5){
  const msgs=await S.db.collection('duelchat/'+d.id+'/msgs').limit(100).get();for(const m of msgs.docs)await serial(()=>S.db.doc('duelchat/'+d.id+'/msgs/'+m.id).delete());
  await serial(()=>S.db.doc('duels/'+d.id).delete())}}}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.me&&S.online&&!G){S.me.lastSeen=Date.now()}});
boot();
</script>
